<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enter PIN — fast-qrcode</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          border: '#e5e5e5', background: '#ffffff', foreground: '#0a0a0a',
          muted: { DEFAULT: '#f5f5f5', foreground: '#737373' },
          primary: { DEFAULT: '#171717', foreground: '#fafafa' }
        },
        fontFamily: { sans: ['Geist', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
      } }
    };
  </script>
</head>
<body class="flex min-h-screen flex-col bg-background text-foreground font-sans antialiased">
  <header class="border-b border-border">
    <div class="mx-auto flex h-14 max-w-5xl items-center px-6">
      <a href="/" class="font-semibold tracking-tight">fast-qrcode</a>
    </div>
  </header>

  <main class="flex flex-1 items-center justify-center px-6 py-16">
    <div class="w-full max-w-sm">
      <!-- PIN form -->
      <form id="lock" class="space-y-4">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">This QR code is protected</h1>
          <p class="mt-2 text-sm text-muted-foreground">Enter the PIN from the person who shared it.</p>
        </div>
        <input
  id="pin"
  type="password"
  inputmode="numeric"
  pattern="[0-9]*"
  autocomplete="off"
  placeholder="PIN"
  autofocus
  class="flex h-10 w-full rounded-md border border-border bg-white px-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-300"
/>
        <p id="err" class="hidden text-sm text-red-600"></p>
        <button class="inline-flex h-10 w-full items-center justify-center rounded-md bg-primary text-sm font-medium text-primary-foreground hover:bg-neutral-700">Unlock</button>
      </form>

      <!-- Result -->
      <div id="open" class="hidden space-y-4">
        <p id="who" class="text-sm text-muted-foreground"></p>
        <div id="body" class="whitespace-pre-wrap break-words rounded-md border border-border bg-muted/50 p-4 text-sm"></div>
        <a id="go" class="hidden h-10 items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground hover:bg-neutral-700" rel="noopener noreferrer">Open link</a>
      </div>
    </div>
  </main>

<script>
const $ = (s) => document.querySelector(s);
const fromB64u = (s) => {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
};
const token = location.hash.slice(1);

async function decrypt(pin) {
  const all = fromB64u(token);
  const salt = all.slice(0, 16), iv = all.slice(16, 28), ct = all.slice(28);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, km,
    { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

function fail(msg) { const e = $('#err'); e.textContent = msg; e.classList.remove('hidden'); }

if (!token) fail('This link is missing its data. Scan the QR code again.');

$('#lock').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!token) return;
  try {
    const d = await decrypt($('#pin').value.trim());
    $('#lock').classList.add('hidden'); $('#open').classList.remove('hidden');
    $('#who').textContent = d.n ? 'Shared by ' + d.n : 'Shared with you';
    $('#body').textContent = d.v;
    if (d.t === 'url' && /^https?:\/\//i.test(d.v)) {
      const a = $('#go'); a.href = d.v; a.classList.remove('hidden'); a.classList.add('inline-flex');
    }
  } catch {
    fail('Wrong PIN. Check it and try again.');
  }
});
</script>
</body>
</html>
